    student_localized_architecture_sweep: reports/protocol_v02_student_localized_architecture_sweep_v1.json
    student_localized_weighted_architecture_sweep: reports/protocol_v02_student_localized_weighted_architecture_sweep_v1.json
    student_localized_weighted_generalization: reports/protocol_v02_student_localized_weighted_generalization_v1.json
